<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#222" />
      <stop offset="1" stop-color="#444" />
    </linearGradient>
    <!-- preserveAspectRatio slice ensures the raster fills the box similarly to CSS background-size: cover -->
  </defs>

  <!-- Embedded raster image: references the original JPEG so visual fidelity is preserved while using an SVG file wrapper. -->
  <image href="bg-1.jpg" x="0" y="0" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" />

  <!-- Decorative overlay (keeps original placeholder look as subtle vignette/graphics) -->
  <rect width="100%" height="100%" fill="url(#g)" style="mix-blend-mode:multiply; opacity:0.38" />
  <g fill="rgba(255,255,255,0.06)">
    <circle cx="160" cy="120" r="240" />
    <circle cx="1400" cy="760" r="320" />
  </g>
</svg>